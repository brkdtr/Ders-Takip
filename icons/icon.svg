<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Icon Graphics: Graduation Cap + Play / Calendar Accent -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Academic Cap Diamond -->
    <path d="M256 120 L416 195 L256 270 L96 195 Z" />
    <!-- Cap Under-band -->
    <path d="M156 235 L156 315 C156 360 356 360 356 315 L356 235 L256 282 Z" opacity="0.95" />
    <!-- Tassel -->
    <path d="M400 205 L400 320 C400 332 388 340 380 340 C372 340 365 332 365 320 L365 218 Z" fill="#fbbf24" />
    
    <!-- Central Play Triangle in Circle -->
    <circle cx="256" cy="385" r="48" fill="#10b981" />
    <polygon points="246,365 276,385 246,405" fill="#ffffff" />
  </g>
</svg>
